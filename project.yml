name: Vellum
options:
  deploymentTarget:
    iOS: "26.0"
  localPackagesGroup: Packages

packages:
  VellumCore:
    path: VellumCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Vellum:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Vellum/Info.plist
      properties:
        CFBundleDisplayName: Vellum
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIAppFonts:
          - "Karla[wght].ttf"
          - "Karla-Italic[wght].ttf"
          - "IBMPlexMono-Regular.ttf"
          - "IBMPlexMono-Medium.ttf"
          - "IBMPlexMono-SemiBold.ttf"
          - "Caveat[wght].ttf"
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Vellum
    dependencies:
      - package: VellumCore
        product: VellumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luiz.vellum
        PRODUCT_NAME: Vellum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"

  VellumUITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VellumUITests
    dependencies:
      - target: Vellum
      - package: VellumCore
        product: VellumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luiz.vellum.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vellum.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Vellum"
        BUNDLE_LOADER: "$(TEST_HOST)"

  VellumFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VellumFlowUITests
    dependencies:
      - target: Vellum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luiz.vellum.flowtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Vellum

schemes:
  Vellum:
    build:
      targets:
        Vellum: all
        VellumUITests: [test]
        VellumFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VellumUITests
        - VellumFlowUITests
